name: Enhance Lesson Plan Navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final lesson-plan navigation and protection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              'Unit-4A-Stormy-Weather.html': {
                  'prev': ('← Previous', '', True),
                  'next': ('Next →', 'Unit-4B-Risky-Business.html', False),
              },
              'Unit-4B-Risky-Business.html': {
                  'prev': ('← Previous', 'Unit-4A-Stormy-Weather.html', False),
                  'next': ('Next →', '', True),
              },
          }

          css = r'''
          /* Final lesson navigation + ownership/protection */
          .lesson-nav{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:relative;z-index:45}
          .lesson-nav.bottom{border-top:1px solid var(--line);border-bottom:0;margin-top:0;margin-bottom:0;padding-top:18px;padding-bottom:18px}
          .lesson-nav a{display:inline-flex;align-items:center;justify-content:center;min-width:125px;padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:800;font-size:.86rem;text-decoration:none;box-shadow:0 4px 12px rgba(22,39,54,.04)}
          .lesson-nav a:hover{background:var(--surface-2);color:var(--accent-2);text-decoration:none;transform:translateY(-1px)}
          .lesson-nav .disabled{opacity:.42;pointer-events:none;cursor:default}.lesson-nav .list{border-color:rgba(49,95,122,.28);color:var(--accent-2)}
          body.protected{user-select:none;-webkit-user-select:none;-moz-user-select:none}
          .owner-badge{position:fixed;top:14px;right:18px;width:86px;height:86px;z-index:80;pointer-events:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.08))}
          .owner-badge svg{width:100%;height:100%;display:block}
          .owner-badge .ring{fill:rgba(255,255,255,.92);stroke:rgba(49,95,122,.34);stroke-width:1.5}
          .owner-badge .initials{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:24px;font-weight:900;letter-spacing:1.5px;fill:#315f7a}
          .owner-badge .namepath{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:8.4px;font-weight:800;letter-spacing:.2px;fill:#23465b}
          @media print{html,body{display:none!important}.lesson-nav,.owner-badge,.topbar,.sidebar,.backtop{display:none!important}}
          @media(max-width:700px){.lesson-nav{padding:10px 10px;gap:7px}.lesson-nav a{min-width:105px;padding:8px 10px;font-size:.78rem}.owner-badge{top:8px;right:8px;width:76px;height:76px}}
          '''

          protection_js = r'''
          <script id="content-protection">
          (function(){
            document.addEventListener('contextmenu',function(e){e.preventDefault();});
            document.addEventListener('copy',function(e){e.preventDefault();});
            document.addEventListener('cut',function(e){e.preventDefault();});
            document.addEventListener('dragstart',function(e){e.preventDefault();});
            document.addEventListener('keydown',function(e){
              const k=(e.key||'').toLowerCase();
              if(e.key==='PrintScreen'||(e.ctrlKey&&['p','u','s','c','x'].includes(k))||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();}
            });
          })();
          </script>
          '''

          def nav_html(info):
              pl, ph, pd = info['prev']
              nl, nh, nd = info['next']
              prev = '<a class="disabled" aria-disabled="true">'+pl+'</a>' if pd else '<a href="'+ph+'">'+pl+'</a>'
              nxt = '<a class="disabled" aria-disabled="true">'+nl+'</a>' if nd else '<a href="'+nh+'">'+nl+'</a>'
              return ('<nav class="lesson-nav top" aria-label="Lesson navigation">'
                      '<a class="list" href="https://don223871-ui.github.io/AEF4-Lesson-Plans/">Lesson List</a>'
                      + prev + nxt + '</nav>')

          def bottom_nav(info):
              pl, ph, pd = info['prev']
              nl, nh, nd = info['next']
              prev = '<a class="disabled" aria-disabled="true">'+pl+'</a>' if pd else '<a href="'+ph+'">'+pl+'</a>'
              nxt = '<a class="disabled" aria-disabled="true">'+nl+'</a>' if nd else '<a href="'+nh+'">'+nl+'</a>'
              return ('<nav class="lesson-nav bottom" aria-label="Lesson navigation">'
                      + prev + '<a class="list" href="https://don223871-ui.github.io/AEF4-Lesson-Plans/">Lesson List</a>' + nxt + '</nav>')

          badge = r'''<div class="owner-badge" aria-label="Mohammad Bakhshandeh ownership mark">
            <svg viewBox="0 0 100 100" role="img" aria-label="MB Mohammad Bakhshandeh">
              <defs><path id="ownerArc" d="M 17,50 A 33,33 0 0,1 83,50" fill="none"/></defs>
              <circle class="ring" cx="50" cy="50" r="43"/>
              <text class="initials" x="50" y="59" text-anchor="middle">MB</text>
              <text class="namepath"><textPath href="#ownerArc" startOffset="50%" text-anchor="middle">Mohammad Bakhshandeh</textPath></text>
            </svg>
          </div>'''

          for filename, info in pages.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')

              if 'class="protected"' not in text:
                  text = text.replace('<body>', '<body class="protected">', 1)

              if '.owner-badge{' not in text:
                  text = text.replace('</style>', css + '\n</style>', 1)

              if 'class="owner-badge"' not in text:
                  text = text.replace('<body class="protected">', '<body class="protected">\n' + badge, 1)

              nav = nav_html(info)
              text = re.sub(r'<nav class="lesson-nav top".*?</nav>', nav, text, count=1, flags=re.S)
              if 'class="lesson-nav top"' not in text:
                  text = text.replace('</header>', '</header>\n' + nav, 1)

              bottom = bottom_nav(info)
              if 'class="lesson-nav bottom"' in text:
                  text = re.sub(r'<nav class="lesson-nav bottom".*?</nav>', bottom, text, count=1, flags=re.S)
              else:
                  text = text.replace('<button id="backtop"', bottom + '\n<button id="backtop"', 1)

              if 'id="content-protection"' not in text:
                  text = text.replace('</body>', protection_js + '\n</body>', 1)

              # Ensure print is blocked even if an older print rule exists.
              if 'html,body{display:none!important}' not in text:
                  text = text.replace('</style>', '@media print{html,body{display:none!important}}\n</style>', 1)

              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit final lesson-plan update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Unit-4A-Stormy-Weather.html Unit-4B-Risky-Business.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize lesson navigation, protection, and ownership mark"
          git push
